<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Mate Budget:{% block title %}{% endblock %}</title>

    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
    <!-- FAVICON-->
     <link href="/static/favicon.png" rel="icon">

    <!-- Your main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    
</head>
<body>

<header class="top-nav-wrapper">
    <nav class="top-nav">
        <div class="brand">
            <span class="brand-logo">MB</span>
            <span class="brand-name">
              {% if username %}
                {{ username|capitalize}} Budgeting
              {% else %}
                Mate Budgeting
              {% endif %}  
            </span>
        </div>

        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
            <span></span>
            <span></span>
        </button>
        {% if session["user_id"] %}
          <ul class="nav-links" id="nav-links">
            
              <li class="{% if active == 'home' %}active{% endif %}"><a href="/">Home</a></li>
              <li class="{% if active == 'add' %}active{% endif %}"><a href="/add">Add Transaction</a></li>
              <li class="{% if active == 'analytics' %}active{% endif %}"><a href="/analytics">Analytics</a></li>
              <li class="{% if active == 'budgets' %}active{% endif %}"><a href="/budgets">Budget</a></li>
              <li class="{% if active == 'transactions' %}active{% endif %}"><a href="/transactions">Transactions</a></li>
              <li class="{% if active == 'profile' %}active{% endif %}"><a href="/profile">Profile</a></li>
              <li><a href="/logout" class="logout-link">Log Out</a></li>
          </ul>
        {% else %}
          <ul class="nav-link" id="nav-links">
            <li><a href="/auth">Authentification</a></li>
          </ul>  
        {% endif %}

    </nav>
</header>

<main class="page-container">
    {% block content %}{% endblock %}
</main>

<!-- Bootstrap JS bundle (includes Popper) -->
<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
  crossorigin="anonymous"
></script>

<!-- Small JS for mobile nav -->
<script>
  const navToggle = document.getElementById('nav-toggle');
  const navLinks  = document.getElementById('nav-links');

  if (navToggle && navLinks) {
    navToggle.addEventListener('click', () => {
      navLinks.classList.toggle('nav-open');
      navToggle.classList.toggle('nav-toggle-open');
    });
  }
</script>

</body>
</html>
